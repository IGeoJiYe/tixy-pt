server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  jackson:
    time-zone: Asia/Seoul
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3307/tixy}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345678}
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity-time: 3600000
  refresh-token-validity-time: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health, caches

support:
  claim-timeout-minutes: 30
  claim-timeout-check-ms: 60000
  ai:
    mode: ${SUPPORT_AI_MODE:hybrid}
    provider: ${SUPPORT_AI_PROVIDER:ollama}
    rag-enabled: ${SUPPORT_AI_RAG_ENABLED:false}
    recent-message-context-limit: ${SUPPORT_AI_RECENT_MESSAGE_CONTEXT_LIMIT:5}
    max-response-characters: ${SUPPORT_AI_MAX_RESPONSE_CHARACTERS:300}
    rag-top-k: ${SUPPORT_AI_RAG_TOP_K:3}
    rag-similarity-threshold: ${SUPPORT_AI_RAG_SIMILARITY_THRESHOLD:0.55}
    rag-resource-pattern: ${SUPPORT_AI_RAG_RESOURCE_PATTERN:classpath:/rag/support/*.md}
