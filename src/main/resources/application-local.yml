spring:
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:ollama}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:ollama}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}

support:
  ai:
    provider: ${SUPPORT_AI_PROVIDER:ollama}